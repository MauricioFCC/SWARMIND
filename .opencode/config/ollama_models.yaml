# Ollama local delegation — tiers por capacidad (minimiza tokens cloud)
# Flota 2026-09-30 (RTX 4060 8GB, nombres canonicos hf.co; cada blob un solo
# nombre, sin alias locales). Frontera: coding y reasoning actualizados.
#   fast:      MiniCPM5-2B Q8_0 — borradores, tareas simples
#   quality:   Qwen3.8-9B distill Q4_K_M — razonamiento general
#   coding:    Qwopus3.5-9B-v3 Q4_K_M — codigo (HumanEval 87.8)
#   reasoning: Qwen3.5-9B Claude-Opus-Distill-v2 — agente (-20% tokens)
#   embedding: qwen3-embedding:0.6b — RAG (auto_pull lo restaura si se usa)
#   vision:    qwen3-vl:4b — imagenes/alt-text (auto_pull lo restaura si se usa)
# El servidor fija OLLAMA_CONTEXT_LENGTH=16384 (scripts/enable_gpu.py): la
# ventana por defecto es 16K sin variantes "16k baked". El harness igual
# envia num_ctx explicito por options (fleet_manifest.py = SSOT).
ollama:
  base_url: "http://localhost:11434"
  timeout: 60
  # warm_on_start VACIO a proposito: precargar al arrancar sumaba VRAM en el
  # boot y contribuyo al BSOD TDR 2026-10-01. Los modelos se cargan bajo
  # demanda (y con el guard de gpu_guard.py). NO reactivar en 8GB.
  warm_on_start: []
  tiers:
    fast:      {model: "hf.co/openbmb/MiniCPM5-2B-GGUF:Q8_0",                          keep_alive: "5m", auto_pull: true}
    quality:   {model: "hf.co/empero-ai/Qwen3.8-9B-Distill-GGUF:Q4_K_M",                keep_alive: "0", auto_pull: true}
    coding:    {model: "hf.co/Jackrong/Qwopus3.5-9B-v3-GGUF:Q4_K_M",                     keep_alive: "0", auto_pull: true}
    embedding: {model: "qwen3-embedding:0.6b", keep_alive: "0", auto_pull: true}
    vision:    {model: "qwen3-vl:4b",          keep_alive: "0", auto_pull: true}
# Politica local-first con supervision cloud como oraculo 1% (ADR-0084/0097):
# 99% local en destilados potentes; el cloud solo verifica muestras.
local_first:
  target_local_ratio: 0.99
  confidence_margin: 0.50
  sample_rate: 0.01
  env_prefix: "SWARMIND_LOCAL_"
