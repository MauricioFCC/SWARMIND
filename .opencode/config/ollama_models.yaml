# Ollama local delegation — tiers por capacidad (minimiza tokens cloud)
# Flota 2026-09-21 (RTX 4060 8GB, nombres canonicos hf.co; cada blob un solo
# nombre, sin alias locales). Medidos: MiniCPM5 81.8 tok/s, Qwen3.8-distill
# 43 tok/s, Qwopus 43 tok/s, GLM-Z1 37 tok/s.
#   fast:      MiniCPM5-2B Q8_0 — borradores, tareas simples
#   quality:   Qwen3.8-9B distill Q4_K_M — razonamiento general
#   coding:    Qwopus3.5-9B coder Q4_K_M — codigo
#   embedding: qwen3-embedding:0.6b — RAG (auto_pull lo restaura si se usa)
#   vision:    qwen3-vl:4b — imagenes/alt-text (auto_pull lo restaura si se usa)
# Extra (uso manual): V4-Flash distill, GLM-Z1-9B, LFM2.5-2.6B (instalados).
# Standby (NO tier: stock Ollama no lo carga): Bonsai-2-27B-PTQ1_0-CRACK
# (Qwen3.8-27B ternario, 5.54GB en .ollama/manual) — requiere fork PrismML.
ollama:
  base_url: "http://localhost:11434"
  timeout: 60
  warm_on_start: [fast]   # precargar al arrancar
  tiers:
    fast:      {model: "hf.co/openbmb/MiniCPM5-2B-GGUF:Q8_0",                          keep_alive: "5m", auto_pull: true}
    quality:   {model: "hf.co/empero-ai/Qwen3.8-9B-Distill-GGUF:Q4_K_M",                keep_alive: "5m", auto_pull: true}
    coding:    {model: "hf.co/Jackrong/Qwopus3.5-9B-Coder-GGUF:Qwopus3.5-9B-coder-Exp-Q4_K_M", keep_alive: "5m", auto_pull: true}
    embedding: {model: "qwen3-embedding:0.6b", keep_alive: "5m", auto_pull: true}
    vision:    {model: "qwen3-vl:4b",          keep_alive: "5m", auto_pull: true}
# Politica local-first con supervision cloud como oraculo 1% (ADR-0084/0097):
# 99% local en destilados potentes; el cloud solo verifica muestras.
local_first:
  target_local_ratio: 0.99
  confidence_margin: 0.50
  sample_rate: 0.01
  env_prefix: "SWARMIND_LOCAL_"
