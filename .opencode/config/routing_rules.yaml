# Routing Rules Configuration v2.0
# Enterprise-grade intent detection with security & architecture gates

# =============================================================================
# REGLAS DE ENRUTAMIENTO POR INTENT
# =============================================================================
routing_rules:
  # =============================================================================
  # ROUTING TYPE: Domain-first dispatch with intent-based fallback
  # =============================================================================
  routing_type: domain
  domain_field: "domain"

  # =============================================================================
  # DOMAIN ROUTES (primary dispatch — matches skill metadata domain field)
  # =============================================================================
  domain_routes:
    - domain: "quantitative-analysis"
      agents: ["scientist", "builder"]
      priority: 9
    - domain: "risk-management"
      agents: ["guardian"]
      priority: 8
    - domain: "trading"
      agents: ["builder", "scientist"]
      priority: 8
    - domain: "architecture"
      agents: ["scientist", "coordinator"]
      priority: 9
    - domain: "ai-ml"
      agents: ["scientist", "evolve"]
      priority: 8
    - domain: "memory"
      agents: ["evolve", "coordinator"]
      priority: 9
    - domain: "quality"
      agents: ["guardian"]
      priority: 8
    - domain: "documentation"
      agents: ["builder", "scientist"]
      priority: 7
    - domain: "security"
      agents: ["guardian"]
      priority: 9
    - domain: "devops"
      agents: ["builder"]
      priority: 7
    - domain: "mobile"
      agents: ["builder"]
      priority: 7
    - domain: "data"
      agents: ["scientist"]
      priority: 7
    - domain: "frontend"
      agents: ["builder"]
      priority: 8
    - domain: "universal"
      agents: ["coordinator", "builder", "scientist", "guardian", "evolve",
               "evolve-researcher", "evolve-engineer", "evolve-analyzer"]
      priority: 10
