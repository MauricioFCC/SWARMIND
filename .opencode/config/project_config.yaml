# ── Universal Project Metadata ────────────────────────────────────────────────
PROJECT_NAME: "AGENTIC"
PROJECT_VERSION: "2.1.0"
DOMAIN: "universal"
TECH_STACK: "Python"
ARCH_PATTERN: "hexagonal"
TEST_FRAMEWORKS: ["pytest"]
CI_PLATFORM: "github-actions"
DEPLOYMENT_TYPE: "library"
CURRENT_PHASE: "E"                             # Execution — madurando, refinamiento continuo
CURRENT_DAY: 1

# ── Outputs / Artifact Warehouse ──────────────────────────────────────────────
OUTPUTS_WAREHOUSE: "outputs/"
OUTPUTS_DIRS:
  workspace: "outputs/workspace/"
  data: "outputs/data/"
  models: "outputs/models/"
  reports: "outputs/reports/"
  logs: "outputs/logs/"

# ── FDE / EVOLVE Config ───────────────────────────────────────────────────────
FDE_MISSION: "Proveer un harness de orquestacion multi-agente robusto, auto-curativo y auto-mejorable"
FDE_STAKEHOLDER: "Todos los proyectos que usan AGENTIC (CQE, Hermes, etc.)"
FDE_METRIC: "Tests pasando + tiempo medio entre fallos + cobertura de skills"
FDE_DAY2: "Mantenimiento por el equipo ASI-Evolve, mejora continua via cognition store"
FDE_DELTA: "Token Economics v2026 implementado: -38% tokens, -41% costo, -44% tiempo"

EVOLVE_ENABLED: true
EVOLVE_LOOP_DIR: ".opencode/loop"
EVOLVE_MAX_ROUNDS: 50
EVOLVE_SAMPLE_N: 3
EVOLVE_PATIENCE: 10
EVOLVE_BEST_SCORE: 0.0
EVOLVE_LAST_ROUND: 0
EVOLVE_COG_COUNT: 0

# ── Token Economics v2026 ─────────────────────────────────────────────────────
TOKEN_CONFIG:
  default_budget: 2048
  compression_level: "medium"
  include_principles: "space_available"
  mechanisms:
    cache_shape_discipline: true        # -38% tokens via KV-cache reuse
    structured_compaction: true         # -41% costo via compression por relevancia
    scoped_context_spawn: true          # -44% tiempo via contexto minimo
    phase_scheduled_mas: true           # -27.3% tokens via ciclo trifasico
    observation_masking: true           # -60% obs. tokens via placeholders
    failure_spend_governance: true      # Stop-loss por tarea + WAL

# ── Harness Core Config ───────────────────────────────────────────────────────
HARNESS:
  language: "Python"
  framework: "LanceDB + MCP + Hermes bridge"
  collections_lancedb:
    - tasks_board
    - rag_chunks
    - asi_cognition_store
    - agent_workspace_logs
    - procedural_skills
    - prompt_evolution_log
    - scheduler_log
    - hitl_approval_log
    - semantic_cache
    - iteration_reports
    - agent_performance
    - skill_effectiveness
    - telemetry_events
    - session_kpis
    - agent_interactions
  agent_count: 8
  skill_count: 10
  model_routing: "hybrid (local Ollama + cloud API)"
  hitl_enabled: true
  gateway_modes: ["cli"]
  scheduler_enabled: true
  evolve_loop_enabled: true
  hermes_bridge_enabled: true
  self_healing:
    circuit_breaker: true
    timeout_seconds: 300
    stall_detection_seconds: 120
    adaptive_replan: true

# ── Agent Ecosystem ───────────────────────────────────────────────────────────
AGENTS:
  total: 8
  agent_list:
    - coordinator        # Swiss Watch orchestrator (default)
    - builder             # Implementacion + Competitive Programming
    - scientist           # Investigacion + AI/ML + Text Analysis
    - guardian            # Calidad + Testing vanguardia + Seguridad
    - evolve              # Meta-agente: auto-mejora continua
    - evolve-researcher   # Sub-agente: investigacion para evolve
    - evolve-engineer     # Sub-agente: ingenieria para evolve
    - evolve-analyzer     # Sub-agente: analisis para evolve

SKILLS:
  total: 10
  skill_list:
    - alpha-research
    - evolve
    - healthtech
    - hedgefund
    - legal-doc
    - math-doc
    - pos-retail
    - quant-trading
    - risk-execution
    - science-doc
