# .opencode/config/project_config.yaml
# =============================================================================
# PROJECT CONFIG — AGENTIC Harness
# =============================================================================
# Sistema multi-agente evolutivo con orquestación DAG, memoria vectorial LanceDB,
# auto-mejora (ASI-Evolve), enrutamiento adaptativo y federated memory.
# =============================================================================

# ── Universal Project Metadata ────────────────────────────────────────────────
PROJECT_NAME: "AGENTIC"
PROJECT_VERSION: "2.0.0"
DOMAIN: "universal"
TECH_STACK: "Python"
ARCH_PATTERN: "hexagonal"
TEST_FRAMEWORKS: ["pytest"]
CI_PLATFORM: "github-actions"
DEPLOYMENT_TYPE: "library"
CURRENT_PHASE: "E"                             # Execution — madurando, refinamiento continuo
CURRENT_DAY: 1

# ── Outputs / Artifact Warehouse ──────────────────────────────────────────────
OUTPUTS_WAREHOUSE: "outputs/"
OUTPUTS_DIRS:
  workspace: "outputs/workspace/"
  data: "outputs/data/"
  models: "outputs/models/"
  reports: "outputs/reports/"
  logs: "outputs/logs/"

# ── FDE / EVOLVE Config ───────────────────────────────────────────────────────
FDE_MISSION: "Proveer un harness de orquestación multi-agente robusto, auto-curativo y auto-mejorable"
FDE_STAKEHOLDER: "Todos los proyectos que usan AGENTIC (CQE, Hermes, etc.)"
FDE_METRIC: "Tests pasando + tiempo medio entre fallos + cobertura de skills"
FDE_DAY2: "Mantenimiento por el equipo ASI-Evolve, mejora continua vía cognition store"
FDE_DELTA: "Pasar de orquestación básica a sistema auto-adaptativo con memoria federada"

EVOLVE_ENABLED: true
EVOLVE_LOOP_DIR: ".opencode/loop"
EVOLVE_MAX_ROUNDS: 50
EVOLVE_SAMPLE_N: 3
EVOLVE_PATIENCE: 10
EVOLVE_BEST_SCORE: 0.0
EVOLVE_LAST_ROUND: 0
EVOLVE_COG_COUNT: 0

# ── Token / Prompt Config ─────────────────────────────────────────────────────
TOKEN_CONFIG:
  default_budget: 2048
  compression_level: "medium"
  include_principles: "space_available"

# ── Harness Core Config ───────────────────────────────────────────────────────
HARNESS:
  language: "Python"
  framework: "LanceDB + MCP + Hermes bridge"
  collections_lancedb:
    - tasks_board
    - rag_chunks
    - asi_cognition_store
    - agent_workspace_logs
    - procedural_skills
    - prompt_evolution_log
    - scheduler_log
    - hitl_approval_log
    - semantic_cache
    - iteration_reports
    - agent_performance
    - skill_effectiveness
    - telemetry_events
    - session_kpis
    - agent_interactions
  agent_count: 8
  skill_count: 10
  model_routing: "hybrid (local Ollama + cloud API)"
  hitl_enabled: true
  gateway_modes: ["cli", "slack", "telegram"]
  scheduler_enabled: true
  evolve_loop_enabled: true
  hermes_bridge_enabled: true
  self_healing:
    circuit_breaker: true
    timeout_seconds: 300
    stall_detection_seconds: 120
    adaptive_replan: true

# ── Agent Ecosystem ───────────────────────────────────────────────────────────
AGENTS:
  total: 8
  agent_list:
    - coordinator
    - builder
    - scientist
    - guardian
    - evolve
    - evolve-researcher
    - evolve-engineer
    - evolve-analyzer

SKILLS:
  total: 10
  skill_list:
    - alpha-research
    - evolve
    - healthtech
    - hedgefund
    - legal-doc
    - math-doc
    - pos-retail
    - quant-trading
    - risk-execution
    - science-doc
