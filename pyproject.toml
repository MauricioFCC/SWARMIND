[build-system]
# setuptools>=83 requerido por ADR-0037: 79.0.1 tiene CVE PYSEC-2026-3447
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]
exclude = ["docs*", ".opencode*"]

[project]
name = "Swarmind-harness"
version = "0.1.0"
description = "Multi-Agent Evolutionary Harness"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    {name = "Mauricio Fonseca Cardona", email = "maodevcol@gmail.com"},
]
keywords = ["multi-agent", "orchestration", "llm", "ai-agents", "ascii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "hypothesis>=6.163.0",
    "lancedb>=0.33",
    "numpy>=1.24",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "schedule>=1.2",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/MauricioFCC/SWARMIND"
Repository = "https://github.com/MauricioFCC/SWARMIND"
Issues = "https://github.com/MauricioFCC/SWARMIND/issues"
Changelog = "https://github.com/MauricioFCC/SWARMIND/blob/main/CHANGELOG.md"
Documentation = "https://github.com/MauricioFCC/SWARMIND/blob/main/docs/src/en/SUMMARY.md"
Citation = "https://github.com/MauricioFCC/SWARMIND/blob/main/CITATION.cff"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3",
    "pytest-xdist>=3",
    "pytest-split>=0.9",
    "ruff>=0.4",
    "mypy>=1.8",
]
test = ["pytest>=8", "pytest-cov>=5", "pytest-mock>=3", "pytest-xdist>=3", "pytest-split>=0.9"]

[dependency-groups]
# Compatibilidad con `uv sync --group <name>` en CI (PEP 735)
dev = [
    "pytest-asyncio>=1.4.0",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3",
    "pytest-xdist>=3",
    "pytest-split>=0.9",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["harness/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# Parallel ejecucion: pytest -n auto (requiere pytest-xdist)
# Por defecto secuencial: la mayoria de tests comparten LanceDB local
addopts = ""
markers = [
    "slow: tests lentos (>1s) que requieren integracion real",
    "integration: tests que dependen de LanceDB real u otros servicios externos",
    "unit: tests unitarios puros sin dependencias externas (default)",
]

[tool.coverage.run]
source = ["harness"]
omit = ["harness/tests/*", "harness/scripts/*"]

[tool.coverage.report]
# Jul 2026: coverage actual 59.69%
fail_under = 62
# Proximo PR: fail_under = 55
# Siguiente:   fail_under = 70
# Objetivo:    fail_under = 80

# ---------------------------------------------------------------------------
# Ruff (linter)
# ---------------------------------------------------------------------------
# Config: mantenemos defaults E/F/I/W/B/UP/SIM/etc y solo ignoramos reglas
# que generan falsos positivos en este proyecto o no aportan valor.
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Reglas ignoradas (con justificacion):
#   EXE001 - "shebang present but file is not executable": ruff solo aplica
#            esta regla en sistemas Unix-like (no en Windows). En CI (Ubuntu)
#            los scripts standalone en harness/scripts/ tienen shebang pero
#            no se ejecutan directamente; se invocan via `uv run` o
#            `python -m`. Mantener la regla activa generaria errores en
#            CI que no podemos verificar localmente. Desactivada globalmente.
ignore = ["EXE001"]


