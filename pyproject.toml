[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]
exclude = ["docs*", ".opencode*"]

[project]
name = "Swarmind-harness"
version = "0.1.0"
description = "Multi-Agent Evolutionary Harness"
# Bump a >=3.12: Python 3.10 EOL 2026-10-31 (3 meses), 3.11 EOL 2027-10-31.
# numpy 2.5.1 (latest stable) requiere >=3.12, pandas 3.x requiere 3.11+, networkx 3.6+ requiere 3.11+.
# Subir a 3.12 permite resolver una sola version de numpy (sin markers duales).
# Trade-off: deja fuera Python 3.11. Justificacion: 3.12 es LTS-ish y CI ya usa 3.12.
requires-python = ">=3.12"
readme = "README.md"
authors = [
    {name = "Mauricio Fonseca Cardona", email = "maodevcol@gmail.com"},
]
keywords = ["multi-agent", "orchestration", "llm", "ai-agents", "ascii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "hypothesis>=6.165.0",
    "lancedb>=0.36",
    "numpy>=2.0",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "schedule>=1.2",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3",
    "pytest-xdist>=3",
    "pytest-split>=0.9",
    "ruff>=0.16",
    "mypy>=2.3",
    "bandit>=1.9",
    "safety>=3.0",
]
test = ["pytest>=8", "pytest-cov>=5", "pytest-mock>=3", "pytest-xdist>=3", "pytest-split>=0.9"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["harness/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# Parallel ejecucion: pytest -n auto (requiere pytest-xdist)
# Por defecto secuencial: la mayoria de tests comparten LanceDB local
addopts = ""
markers = [
    "slow: tests lentos (>1s) que requieren integracion real",
    "integration: tests que dependen de LanceDB real u otros servicios externos",
    "unit: tests unitarios puros sin dependencias externas (default)",
]

[tool.coverage.run]
source = ["harness"]
omit = ["harness/tests/*", "harness/scripts/*"]

[tool.coverage.report]
# Jul 2026: coverage actual 59.69%
fail_under = 62
# Proximo PR: fail_under = 55
# Siguiente:   fail_under = 70
# Objetivo:    fail_under = 80


