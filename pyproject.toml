[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness*"]
exclude = ["docs*", ".opencode*"]

[project]
name = "Swarmind-harness"
version = "0.1.0"
description = "Multi-Agent Evolutionary Harness"
requires-python = ">=3.10"
readme = "README.md"
authors = [
    {name = "Mauricio Fonseca Cardona", email = "maodevcol@gmail.com"},
]
keywords = ["multi-agent", "orchestration", "llm", "ai-agents", "ascii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "hypothesis>=6.163.0",
    "lancedb>=0.33",
    "numpy>=1.24",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "schedule>=1.2",
    "torch>=2.0",
]

[project.urls]
Homepage = "https://github.com/MauricioFCC/SWARMIND"
Repository = "https://github.com/MauricioFCC/SWARMIND"
Issues = "https://github.com/MauricioFCC/SWARMIND/issues"
Changelog = "https://github.com/MauricioFCC/SWARMIND/blob/main/CHANGELOG.md"
Documentation = "https://github.com/MauricioFCC/SWARMIND/blob/main/docs/src/en/SUMMARY.md"
Citation = "https://github.com/MauricioFCC/SWARMIND/blob/main/CITATION.cff"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-mock>=3",
    "pytest-xdist>=3",
    "pytest-split>=0.9",
    "ruff>=0.4",
    "mypy>=1.8",
]
test = ["pytest>=8", "pytest-cov>=5", "pytest-mock>=3", "pytest-xdist>=3", "pytest-split>=0.9"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["harness/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# Parallel ejecucion: pytest -n auto (requiere pytest-xdist)
# Por defecto secuencial: la mayoria de tests comparten LanceDB local
addopts = ""
markers = [
    "slow: tests lentos (>1s) que requieren integracion real",
    "integration: tests que dependen de LanceDB real u otros servicios externos",
    "unit: tests unitarios puros sin dependencias externas (default)",
]

[tool.coverage.run]
source = ["harness"]
omit = ["harness/tests/*", "harness/scripts/*"]

[tool.coverage.report]
# Jul 2026: coverage actual 59.69%
fail_under = 62
# Proximo PR: fail_under = 55
# Siguiente:   fail_under = 70
# Objetivo:    fail_under = 80


