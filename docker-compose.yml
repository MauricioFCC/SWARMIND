# Docker Compose para SWARMIND (imagen de referencia / onboarding).
#
#   docker compose build
#   docker compose run --rm swarmind
#
# El nucleo no requiere GPU ni LanceDB. Para persistencia vectorial:
#   EXTRAS=lancedb docker compose build

services:
  swarmind:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        EXTRAS: test
    image: swarmind-harness:compose
    container_name: swarmind
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "python", "-c", "import harness; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    user: "1001:1001"
