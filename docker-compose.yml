version: '3.8'
services:
  Swarmind:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    image: swarmind:latest
    container_name: swarmind
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./.opencode:/app/.opencode
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      test: ["CMD", "python", "-c", "import harness; print('OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Security: ejecutar como usuario no-root (UID 1001)
    user: "1001:1001"
