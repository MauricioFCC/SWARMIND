# HITL (Human-in-the-Loop) Configuration
# =======================================
# Controls how destructive actions are intercepted and require approval.

# Timeout in seconds for user approval (default: 300 = 5 min)
timeout: 300

# Log directory for HITL decisions (optional, LanceDB used if available)
log_dir: ""

# Destructive patterns to intercept
# Each pattern has a regex, label, and severity (critical/high/medium/low)
# - critical: Always blocked (even in sensitive mode)
# - high: Blocked in normal mode
# - medium: Blocked in normal mode
# - low: Informational only
destructive_patterns:
  # ── Database ──
  - pattern: '\bDROP\s+(TABLE|DATABASE|SCHEMA|INDEX|VIEW|PROCEDURE|FUNCTION)\b'
    label: database_drop
    severity: critical
  - pattern: '\bDELETE\s+FROM\b(?!.*\bWHERE\b)'
    label: delete_without_where
    severity: critical
  - pattern: '\bTRUNCATE\s+TABLE\b'
    label: truncate_table
    severity: critical
  - pattern: '\bALTER\s+.*\bDROP\b'
    label: alter_drop
    severity: high

  # ── Filesystem ──
  - pattern: '\brm\s+-[rf]+\b'
    label: recursive_remove
    severity: critical
  - pattern: '\b(?:mkfs|format)\s+'
    label: format_disk
    severity: critical
  - pattern: '\bdd\s+if='
    label: dd_destructive
    severity: critical
  - pattern: '>\s*/dev/'
    label: write_to_device
    severity: critical

  # ── Infrastructure ──
  - pattern: '\bterraform\s+(apply|destroy)\b(?!.*\b-plan\b)'
    label: terraform_destructive
    severity: critical
  - pattern: '\bkubectl\s+delete\b.*\b--force\b'
    label: kubectl_force_delete
    severity: high
  - pattern: '\bdocker\s+(rm|rim|system\s+prune)\s+-f'
    label: docker_force_remove
    severity: high

  # ── Git / Deploy ──
  - pattern: '\bgit\s+push\s+--force\b'
    label: git_force_push
    severity: high
  - pattern: '\bnpm\s+(publish|unpublish)\b'
    label: npm_publish
    severity: medium
  - pattern: '\bpip\s+install\b.*\b--no-verify\b'
    label: pip_no_verify
    severity: medium

  # ── System ──
  - pattern: '\bkill\s+-9\b'
    label: force_kill
    severity: medium
  - pattern: '>\s+/etc/'
    label: write_system_config
    severity: high
  - pattern: '\bsudo\s+'
    label: sudo_command
    severity: medium
