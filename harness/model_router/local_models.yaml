# SSOT de la flota local de modelos (backend llama.cpp / llama-swap).
#
# UNICO lugar a editar para agregar/quitar/cambiar un modelo. Tras editar:
#     uv run python scripts/render_local_models.py
# regenera (idempotente) `backend.swap_config` (llama-swap.yaml) y parchea
# `.opencode/opencode.json` + `~/.config/opencode/opencode.jsonc`.
# Gate CI (exit 1 si el render difiere de lo que hay en disco):
#     uv run python scripts/render_local_models.py --check
#
# PORTABLE MULTI-SO: las rutas usan la plantilla `${SWARMIND_LLAMA_DIR}` resuelta
# por entorno (ver `scripts/setup_local_env.py`). Setearla en cada sistema:
#   Windows (PowerShell):  setx SWARMIND_LLAMA_DIR "C:\Users\<tu>\llama"
#   Linux/macOS (bash):    export SWARMIND_LLAMA_DIR="$HOME/llama"   # => ~/.bashrc
#   macOS (zsh):           export SWARMIND_LLAMA_DIR="$HOME/llama"   # => ~/.zprofile
# (La unica pieza NO portable es el path del binario; se resuelve con la misma var.)
#
# Campos de cada modelo de `models`:
#   id       nombre corto servido por llama-swap (canonico)
#   file     ruta absoluta al .gguf
#   ctx      ventana de contexto real (-c)
#   max_prompt_tokens  (OPCIONAL) techo de prompt; si se omite se DERIVA como
#                      ctx - reserved_tokens (evita drift al subir `ctx`)
#   flags    referencia a una clave de `flags` (SAFE | SMALL)
#   role     rol de capacidad (coding | reasoning | fast | deep | embedding)
#   aliases  nombres alternos que llama-swap expone
#   opencode true (default) para publicar en el picker de opencode; false para
#            servir SOLO por llama-swap (p.ej. el modelo `deep` no se expone)
backend:
  server_exe: "${SWARMIND_LLAMA_DIR}\\bin\\llama-server.exe"
  host: "127.0.0.1"
  port: 11434
  swap_exe: "${SWARMIND_LLAMA_DIR}\\swap\\llama-swap.exe"
  swap_config: "${SWARMIND_LLAMA_DIR}\\llama-swap.yaml"
  start_port: 18080
flags:
  SAFE: "-ngl 99 --parallel 1 -ub 256 -b 1024 -fa on -ctk q8_0 -ctv q8_0 --jinja"
  SMALL: "-ngl 99 --parallel 2 -ub 256 -b 1024 -fa on -ctk q8_0 -ctv q8_0 --jinja"
  #: CAPACITY: maxima FUNCIONALIDAD sobre velocidad (no-Misellium).
  #:   -nkvo         KV cache en RAM, no en VRAM -> libera GPU y ELIMINA el
  #:                 riesgo de TDR por crecimiento de KV (la causa del BSOD).
  #:   -ctk/-ctv q4_0 KV a la mitad que q8_0 ("casi sin perdida" en Qwen).
  #:   Habilitado por el guard: techo de ctx 131072 en vez de 36864.
  #: Mas lento (atencion en CPU): el objetivo aqui es capacidad y certeza.
  CAPACITY: "-ngl 99 --parallel 1 -ub 256 -b 1024 -fa on -ctk q4_0 -ctv q4_0 -nkvo --jinja"
default_ctx: 36864
default_ttl: 180
concurrency_limit: 1
#: Margen anti-volcado/saturacion: ahora vive en RamBudget (env
#: SWARMIND_SAFETY_MARGIN_MB, default 1500); declarar `safety_margin_mb` aqui
#: lo fijaria y anularia el override por entorno.
#: Presupuesto de SALIDA (max_tokens disponibles = ctx - reserved_tokens).
#: Subido 2048 -> 4096 -> 6144: los modelos de razonamiento generan trazas
#: largas antes de responder y con menos se agotaba dejando `content` vacio.
#: NO afecta la VRAM: el `-c` (ctx) dimensiona la KV cache; esto solo reparte
#: ctx entre prompt y respuesta.
reserved_tokens: 6144
vram_budget_mb: 8000
safe_ctx_max: 36864
#: Presupuesto de RAM (anti-volcado/OOM) y techo de ctx con KV en RAM: viven
#: en RamBudget (env SWARMIND_RAM_BUDGET_MB / SWARMIND_SAFE_CTX_MAX_RAM_KV,
#: defaults 14000 / 131072). Cada modelo declara `ram_mb` (pesos + KV si
#: CAPACITY); medir con bench. Declararlo aqui anularia el override por env.
models:
  #: FLOTA FINAL (2026-10-08): 3 modelos de razonamiento + embeddings.
  #: Se retiraron qwen2.5-coder-3b y phi-4-mini-instruct: daban ruido en tareas
  #: complejas y el instruct queda superado por su variante reasoning.
  #: Razonamiento 9B (calidad). ctx ACOTADO a 12288: con 36864 el KV cache
  #: empujaba el total sobre 8 GB y provocaba los desbordes/TDR.
  - {id: mimo-v2-6-distill-qwen-9b-gguf-iq4-xs, file: "${SWARMIND_LLAMA_DIR}\\models\\MiMo-V2.6-Distill-Qwen-9B-IQ4_XS.gguf", ctx: 12288, flags: SAFE, role: reasoning, ram_mb: 5300, aliases: [MiMo-V2.6-Distill-Qwen-9B-IQ4_XS]}
  #: Razonamiento 3.8B (Microsoft): multi-paso, math, logica. Base del trading.
  #: PUNTO DULCE (bench 2026-10-08): CAPACITY@32768 -> 24.6 tok/s y 3861 MiB
  #: (-28% vel y -180MiB vs 65536). Ventana 32K sobra para small/trivial.
  - {id: phi-4-mini-reasoning-q4-k-m, file: "${SWARMIND_LLAMA_DIR}\\models\\microsoft_Phi-4-mini-reasoning-Q4_K_M.gguf", ctx: 32768, flags: CAPACITY, role: reasoning, ram_mb: 5300, aliases: [microsoft_Phi-4-mini-reasoning-Q4_K_M]}
  #: Razonamiento 4B (Alibaba, Thinking-2507): AIME2025 81.3 / GPQA 65.8.
  #: Familia distinta a phi -> diversidad para votacion/ensemble en analisis.
  - {id: qwen3-4b-thinking-2507-q4-k-m, file: "${SWARMIND_LLAMA_DIR}\\models\\Qwen3-4B-Thinking-2507-Q4_K_M.gguf", ctx: 65536, flags: CAPACITY, role: reasoning, ram_mb: 5300, aliases: [Qwen3-4B-Thinking-2507-Q4_K_M]}
  #: Embeddings para RAG (Memoria SSOT). Proposito distinto al razonamiento.
  - {id: qwen3-embedding-0-6b, file: "${SWARMIND_LLAMA_DIR}\\models\\Qwen3-Embedding-0.6B-Q8_0.gguf", ctx: 16384, flags: SAFE, role: embedding, ram_mb: 700, aliases: [Qwen3-Embedding-0.6B-Q8_0]}
  #: TERNARIO 27B (REACTIVADO por decision del operador 2026-10-09): modelo de
  #: DECISION del fondo (Misellium DECISION_MODEL). Requiere fork PrismML
  #: (`server_exe` propio, SWARMIND_PRISM_DIR), temperature 1.0 / top-p 0.95 /
  #: top-k 20 (greedy colapsa a 1/4) y -nkvo (perfil CAPACITY). Riesgo EDV:
  #: pico de RAM deja ~0.8GB libres de 16GB (margen < 1.5GB del guard); operar
  #: solo en sesiones con el resto de modelos fríos (ttl) y ctx 16384 acotado.
  - {id: ternary-bonsai-2-27b-ptq1-0, file: "${SWARMIND_LLAMA_DIR}\\models\\Ternary-Bonsai-2-27B-PTQ1_0.gguf", ctx: 16384, flags: CAPACITY, role: reasoning, ram_mb: 12500, aliases: [Ternary-Bonsai-2-27B-PTQ1_0], server_exe: "${SWARMIND_PRISM_DIR}\\bin\\llama-server.exe"}
opencode:
  provider: llamacpp
  base_url: "http://127.0.0.1:11434/v1"
  model: opencode-go/deepseek-v4.1-flash
  #: LOCAL SOLO TRIVIAL (politica 2026-10-10): el oraculo cloud resuelve el
  #: trabajo real (calidad); el local (mimo) atiende SOLO tareas triviales via
  #: small_model. Los LLM locales carecen de calidad para razonamiento/codigo
  #: complejo (mimo es el unico medianamente funcional). Escape: enrutamiento
  #: por agente explicito en local_models.yaml o SWARMIND_REQUIRE_LOCAL=1.
  small_model: mimo-v2-6-distill-qwen-9b-gguf-iq4-xs
  cloud_oracle: opencode-go/deepseek-v4.1-flash
  #: Politica LOCAL SOLO TRIVIAL: TODOS los agentes (workers) van al oraculo
  #: cloud; el local (mimo) se reserva para small_model (tareas triviales).
  #: Los LLM locales no alcanzan calidad frontier; se usan solo lo trivial para
  #: no pagar cloud en lo mecánico. Para forzar local en un agente concreto,
  #: pon su id local en su entrada (la SSOT lo valida contra la flota).
  agents:
    coordinator: cloud_oracle
    architect: cloud_oracle
    builder: cloud_oracle
    guardian: cloud_oracle
    scientist: cloud_oracle
    reviewer: cloud_oracle
    backend-engineer: cloud_oracle
    data-engineer: cloud_oracle
    database-administrator: cloud_oracle
    devops: cloud_oracle
    frontend-engineer: cloud_oracle
    mobile-engineer: cloud_oracle
    platform-engineer: cloud_oracle
    product-manager: cloud_oracle
    qa-engineer: cloud_oracle
    release-ops: cloud_oracle
    researcher: cloud_oracle
    security-engineer: cloud_oracle
    test-writer: cloud_oracle
    explore: cloud_oracle
    general: cloud_oracle
    evolve: cloud_oracle
    evolve-analyzer: cloud_oracle
    evolve-engineer: cloud_oracle
    evolve-researcher: cloud_oracle
    token-budget-auditor: cloud_oracle
