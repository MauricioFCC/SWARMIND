# SSOT de la flota local de modelos (backend llama.cpp / llama-swap).
#
# UNICO lugar a editar para agregar/quitar/cambiar un modelo. Tras editar:
#     uv run python scripts/render_local_models.py
# regenera (idempotente) `backend.swap_config` (llama-swap.yaml) y parchea
# `.opencode/opencode.json` + `~/.config/opencode/opencode.jsonc`.
# Gate CI (exit 1 si el render difiere de lo que hay en disco):
#     uv run python scripts/render_local_models.py --check
#
# PORTABLE MULTI-SO: las rutas usan la plantilla `${SWARMIND_LLAMA_DIR}` resuelta
# por entorno (ver `scripts/setup_local_env.py`). Setearla en cada sistema:
#   Windows (PowerShell):  setx SWARMIND_LLAMA_DIR "C:\Users\<tu>\llama"
#   Linux/macOS (bash):    export SWARMIND_LLAMA_DIR="$HOME/llama"   # => ~/.bashrc
#   macOS (zsh):           export SWARMIND_LLAMA_DIR="$HOME/llama"   # => ~/.zprofile
# (La unica pieza NO portable es el path del binario; se resuelve con la misma var.)
#
# Campos de cada modelo de `models`:
#   id       nombre corto servido por llama-swap (canonico)
#   file     ruta absoluta al .gguf
#   ctx      ventana de contexto real (-c)
#   max_prompt_tokens  (OPCIONAL) techo de prompt; si se omite se DERIVA como
#                      ctx - reserved_tokens (evita drift al subir `ctx`)
#   flags    referencia a una clave de `flags` (SAFE | SMALL)
#   role     rol de capacidad (coding | reasoning | fast | deep | embedding)
#   aliases  nombres alternos que llama-swap expone
#   opencode true (default) para publicar en el picker de opencode; false para
#            servir SOLO por llama-swap (p.ej. el modelo `deep` no se expone)
backend:
  server_exe: "${SWARMIND_LLAMA_DIR}\\bin\\llama-server.exe"
  host: "127.0.0.1"
  port: 11434
  swap_exe: "${SWARMIND_LLAMA_DIR}\\swap\\llama-swap.exe"
  swap_config: "${SWARMIND_LLAMA_DIR}\\llama-swap.yaml"
  start_port: 18080
flags:
  SAFE: "-ngl 99 --parallel 1 -ub 256 -b 1024 -fa on -ctk q8_0 -ctv q8_0 --jinja"
  SMALL: "-ngl 99 --parallel 2 -ub 256 -b 1024 -fa on -ctk q8_0 -ctv q8_0 --jinja"
default_ctx: 36864
default_ttl: 180
concurrency_limit: 1
safety_margin_mb: 1500
reserved_tokens: 2048
vram_budget_mb: 8000
safe_ctx_max: 36864
models:
  - {id: qwen2.5-coder-3b-iq4-xs, file: "${SWARMIND_LLAMA_DIR}\\models\\Qwen2.5-Coder-3B-Instruct-IQ4_XS.gguf", ctx: 36864, flags: SAFE, role: coding, aliases: [Qwen2.5-Coder-3B-Instruct-IQ4_XS]}
  - {id: phi-4-mini-instruct-q4-k-m, file: "${SWARMIND_LLAMA_DIR}\\models\\microsoft_Phi-4-mini-instruct-Q4_K_M.gguf", ctx: 36864, flags: SAFE, role: reasoning, aliases: [microsoft_Phi-4-mini-instruct-Q4_K_M]}
  - {id: qwen3-5-4b-gguf-ud-q4-k-xl, file: "${SWARMIND_LLAMA_DIR}\\models\\Qwen3.5-4B-UD-Q4_K_XL.gguf", ctx: 36864, flags: SAFE, role: fast, aliases: ["hf.co/unsloth/Qwen3.5-4B-GGUF:UD-Q4_K_XL"]}
  - {id: deepseek-r1-distill-qwen-7b-q2-k, file: "${SWARMIND_LLAMA_DIR}\\models\\DeepSeek-R1-Distill-Qwen-7B-Q2_K.gguf", ctx: 36864, flags: SAFE, role: deep, aliases: [DeepSeek-R1-Distill-Qwen-7B-Q2_K]}
  - {id: qwen3-embedding-0-6b, file: "${SWARMIND_LLAMA_DIR}\\models\\Qwen3-Embedding-0.6B-Q8_0.gguf", ctx: 8192, flags: SAFE, role: embedding, aliases: [Qwen3-Embedding-0.6B-Q8_0]}
opencode:
  provider: llamacpp
  base_url: "http://127.0.0.1:11434/v1"
  model: qwen2.5-coder-3b-iq4-xs
  small_model: qwen2.5-coder-3b-iq4-xs
  cloud_oracle: opencode-go/deepseek-v4.1-flash
  #: Mapeo agente -> modelo LOCAL explicito (subagentes sin model heredan el
  #: del padre = cloud; asi TODA delegacion cae al local, no al oraculo).
  #: coordinator = cloud_oracle (oraculo/guia); el resto, workers locales.
  agents:
    coordinator: cloud_oracle
    builder: qwen2.5-coder-3b-iq4-xs
    guardian: phi-4-mini-instruct-q4-k-m
    scientist: phi-4-mini-instruct-q4-k-m
    reviewer: deepseek-r1-distill-qwen-7b-q2-k
    architect: phi-4-mini-instruct-q4-k-m
    backend-engineer: qwen2.5-coder-3b-iq4-xs
    data-engineer: qwen2.5-coder-3b-iq4-xs
    database-administrator: qwen2.5-coder-3b-iq4-xs
    devops: qwen2.5-coder-3b-iq4-xs
    frontend-engineer: qwen2.5-coder-3b-iq4-xs
    mobile-engineer: qwen2.5-coder-3b-iq4-xs
    platform-engineer: qwen2.5-coder-3b-iq4-xs
    product-manager: phi-4-mini-instruct-q4-k-m
    qa-engineer: phi-4-mini-instruct-q4-k-m
    release-ops: qwen2.5-coder-3b-iq4-xs
    researcher: phi-4-mini-instruct-q4-k-m
    security-engineer: qwen2.5-coder-3b-iq4-xs
    test-writer: qwen2.5-coder-3b-iq4-xs
    explore: phi-4-mini-instruct-q4-k-m
    general: phi-4-mini-instruct-q4-k-m
    evolve: phi-4-mini-instruct-q4-k-m
    evolve-analyzer: phi-4-mini-instruct-q4-k-m
    evolve-engineer: qwen2.5-coder-3b-iq4-xs
    evolve-researcher: phi-4-mini-instruct-q4-k-m
    token-budget-auditor: phi-4-mini-instruct-q4-k-m
