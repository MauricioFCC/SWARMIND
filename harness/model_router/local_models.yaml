# SSOT de la flota local de modelos (backend llama.cpp / llama-swap).
#
# UNICO lugar a editar para agregar/quitar/cambiar un modelo. Tras editar:
#     uv run python scripts/render_local_models.py
# regenera (idempotente) `backend.swap_config` (llama-swap.yaml) y parchea
# `.opencode/opencode.json` + `~/.config/opencode/opencode.jsonc`.
# Gate CI (exit 1 si el render difiere de lo que hay en disco):
#     uv run python scripts/render_local_models.py --check
#
# Campos de cada modelo de `models`:
#   id       nombre corto servido por llama-swap (canonico)
#   file     ruta absoluta al .gguf
#   ctx      ventana de contexto real (-c)
#   flags    referencia a una clave de `flags` (SAFE | SMALL)
#   role     rol de capacidad (coding | reasoning | fast | deep | embedding)
#   aliases  nombres alternos que llama-swap expone
#   opencode true (default) para publicar en el picker de opencode; false para
#            servir SOLO por llama-swap (p.ej. el modelo `deep` no se expone)
backend:
  server_exe: "C:\\Users\\USUARIO\\llama\\bin\\llama-server.exe"
  host: "127.0.0.1"
  port: 11434
  swap_exe: "C:\\Users\\USUARIO\\llama\\swap\\llama-swap.exe"
  swap_config: "C:\\Users\\USUARIO\\llama\\llama-swap.yaml"
  start_port: 18080
flags:
  SAFE: "-ngl 99 --parallel 1 -ub 256 -b 1024 -fa on -ctk q8_0 -ctv q8_0 --jinja"
  SMALL: "-ngl 99 --parallel 2 -ub 256 -b 1024 -fa on -ctk q8_0 -ctv q8_0 --jinja"
default_ctx: 32768
default_ttl: 300
models:
  - {id: qwen2.5-coder-3b-iq4-xs, file: "C:\\Users\\USUARIO\\llama\\models\\Qwen2.5-Coder-3B-Instruct-IQ4_XS.gguf", ctx: 32768, flags: SAFE, role: coding, aliases: [Qwen2.5-Coder-3B-Instruct-IQ4_XS]}
  - {id: phi-4-mini-instruct-q4-k-m, file: "C:\\Users\\USUARIO\\llama\\models\\microsoft_Phi-4-mini-instruct-Q4_K_M.gguf", ctx: 32768, flags: SAFE, role: reasoning, aliases: [microsoft_Phi-4-mini-instruct-Q4_K_M]}
  - {id: qwen3-5-4b-gguf-ud-q4-k-xl, file: "C:\\Users\\USUARIO\\llama\\models\\Qwen3.5-4B-UD-Q4_K_XL.gguf", ctx: 32768, flags: SAFE, role: fast, aliases: ["hf.co/unsloth/Qwen3.5-4B-GGUF:UD-Q4_K_XL"]}
  - {id: deepseek-r1-distill-qwen-7b-q2-k, file: "C:\\Users\\USUARIO\\llama\\models\\DeepSeek-R1-Distill-Qwen-7B-Q2_K.gguf", ctx: 32768, flags: SAFE, role: deep, aliases: [DeepSeek-R1-Distill-Qwen-7B-Q2_K]}
  - {id: qwen3-embedding-0-6b, file: "C:\\Users\\USUARIO\\llama\\models\\Qwen3-Embedding-0.6B-Q8_0.gguf", ctx: 8192, flags: SAFE, role: embedding, aliases: [Qwen3-Embedding-0.6B-Q8_0]}
opencode:
  provider: llamacpp
  base_url: "http://127.0.0.1:11434/v1"
  model: qwen2.5-coder-3b-iq4-xs
  small_model: qwen3-5-4b-gguf-ud-q4-k-xl
  cloud_oracle: opencode-go/deepseek-v4.1-flash
  agents: {coordinator: cloud_oracle, builder: qwen2.5-coder-3b-iq4-xs, guardian: phi-4-mini-instruct-q4-k-m, scientist: phi-4-mini-instruct-q4-k-m, reviewer: deepseek-r1-distill-qwen-7b-q2-k}
