# Model Router Configuration
# =========================
# Hybrid routing: simple tasks → local (Ollama), complex tasks → cloud API
# When Hermes is available, routes through Hermes with its configured providers

hermes:
  enabled: true
  auto_detect: true  # Automatically use Hermes if HERMES_HOME exists
  skill_prefix: "@agentic-"  # Prefix for AGENTIC-specific skills in Hermes

local:
  enabled: true
  provider: ollama
  model: llama3
  endpoint: http://localhost:11434
  timeout: 120
  fallback_to_cloud: true

cloud:
  enabled: true
  provider: zenfree  # or the configured cloud provider
  api_key: ${API_KEY}
  model: gpt-4o-mini

routing_rules:
  agent_defaults:
    software-engineer: cloud
    enterprise-architect: cloud
    quant-developer: cloud
    ai-engineer: cloud
    security-engineer: cloud
    context-engineer: local
    documentation-specialist: local
    tool-mcp-engineer: local
    qualifier-agent: local
    evolve-researcher: cloud
    evolve-engineer: cloud
    quality-gate: local
    data-architect: cloud
    devops-sre: cloud
    "*": local  # default for unknown roles

  destructive_keywords:
    - DROP
    - DELETE
    - "rm -rf"
    - "terraform destroy"
    - "terraform apply"
    - "format C:"
    - "dd if="
    - "kubectl delete"
    - "docker rm -f"

  short_task_threshold_chars: 200
