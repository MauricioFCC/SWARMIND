# Mutation Testing — mutmut (doctrina TST: mutation score >= 70%)
#
# Cierra el gap de calidad de tests del repo: coverage line (62%) no mide
# debilidad de assertions; mutation testing SI. Ejecuta mutmut 3.7.0 (UPG:
# ultima estable, requires-python >=3.10, CI usa 3.12) sobre un subconjunto
# ESTRATEGICO y acotado de modulos core puros para que el job dure < 30 min.
#
# Notas de diseno (UPG / sintaxis mutmut 3.7.0, verificada en source):
#   - NO existe el flag --fail-under en v3.x (era de v2). El gate se implementa
#     con `mutmut export_cicd_stats` -> mutants/mutmut-cicd-stats.json y un
#     paso Python que calcula el score y falla si < 70%.
#   - NO existe --runner: mutmut usa pytest.main() interno del venv. Se invoca
#     via `uv run mutmut` para que use las deps del lockfile.
#   - NO existe --paths-to-mutate por CLI: la config vive en pyproject.toml
#     [tool.mutmut] o setup.cfg. NO tocamos pyproject.toml (lo gestiona otro
#     agente) -> el job crea un setup.cfg TEMPORAL en el runner y lo borra.
#   - NO existe --show-mutants: la evidencia del score + supervivientes se
#     imprime con `mutmut results` y el JSON exportado (artifact).
#   - `harness/compression/` no existe en el repo (verificado con glob): los
#     modulos de compresion viven en harness/memory_rag/.
#   - mutmut 3.x requiere fork (no corre en Windows nativo, issue #397);
#     corre en ubuntu-latest sin problema.
#
# Conventional commit style: chore(ci): mutation testing gate >= 70%

name: Mutation Testing

on:
  # Manual (debug / ejecucion bajo demanda de un subconjunto)
  workflow_dispatch:
  # Semanal: lunes 05:00 UTC. NO en cada push (mutation testing ~horas).
  schedule:
    - cron: "0 5 * * 1"

jobs:
  mutation:
    # Nombre en minusculas: consistente con los required checks de main
    # (lint/test/security son case-sensitive).
    name: mutation
    runs-on: ubuntu-latest
    # Red de seguridad: objetivo < 30 min (subconjunto acotado + tests
    # dedicados), margen para cold start / instalacion de deps.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: |
          uv sync --group test
          uv pip install mutmut

      - name: Configure mutmut (setup.cfg temporal)
        # source_paths: subconjunto estrategico de logica core pura con tests
        # dedicados y rapidos. pbt_stage.py queda FUERA por ahora: ejecuta
        # hypothesis en subprocess (lento, arriesga el presupuesto < 30 min).
        # pytest_add_cli_args_test_selection: acota el stats collection a los
        # tests dedicados (evita correr los 4465 tests por cada mutante).
        run: |
          cat > setup.cfg <<'MUTMUT_CFG'
          [mutmut]
          source_paths =
              harness/memory_rag/cache_geometry.py
              harness/memory_rag/compaction.py
              harness/memory_rag/reversible_compaction.py
              harness/memory_rag/shaped_cache.py
          pytest_add_cli_args_test_selection =
              harness/tests/test_cache_geometry.py
              harness/tests/test_compaction.py
              harness/tests/test_reversible_compaction.py
              harness/tests/test_semantic_cache_extended.py
              harness/tests/test_pbt_core.py
          MUTMUT_CFG
          echo "setup.cfg temporal creado (no se versiona)"

      - name: Run mutation testing
        # --max-children 2: runner hosted standard = 2 vCPU; evita thrashing.
        # El runner interno usa pytest.main() del venv (uv run).
        run: |
          uv run mutmut run --max-children 2

      - name: Export CI/CD stats
        # Genera mutants/mutmut-cicd-stats.json con killed/survived/total/
        # no_tests/skipped/timeout/suspicious (evidencia para el gate).
        # Nota: click normaliza underscores a guiones (export_cicd_stats ->
        # export-cicd-stats), verificado en mutmut 3.7.0.
        run: |
          uv run mutmut export-cicd-stats

      - name: Show non-killed mutants
        # Evidencia en log: lista mutantes supervivientes / sin tests / etc.
        # Sin --all para no inundar el log con los killed.
        run: |
          uv run mutmut results || true

      - name: Enforce mutation score gate (>= 70%)
        # Gate equivalente a --fail-under=70 (no existe en mutmut 3.x).
        # Formula (estandar mutation testing):
        #   score = killed / (total - no_tests - skipped)
        # no_tests > 0 => el subconjunto tiene codigo sin tests asociados:
        # falla con mensaje accionable (WHAT+WHY+WHERE, doctrina ERR).
        run: |
          uv run python - <<'PY'
          """Gate de mutation score (doctrina TST, >= 70%).

          Lee mutants/mutmut-cicd-stats.json generado por `mutmut
          export-cicd-stats` y falla si el score es < 70% o si hay
          mutantes sin tests asociados (no_tests > 0).

          Returns:
              Exit code 0 si PASS; 1 si FAIL (score bajo o no_tests).
          """
          import json
          import pathlib
          import sys

          stats_path = pathlib.Path("mutants/mutmut-cicd-stats.json")
          stats = json.loads(stats_path.read_text(encoding="utf-8"))
          denominator = stats["total"] - stats["no_tests"] - stats["skipped"]
          score = stats["killed"] / denominator if denominator > 0 else 0.0
          print(f"mutation score: {score:.1%} ({stats['killed']}/{denominator})")
          print(
              f"killed={stats['killed']} survived={stats['survived']} "
              f"no_tests={stats['no_tests']} timeout={stats['timeout']} "
              f"suspicious={stats['suspicious']} skipped={stats['skipped']} "
              f"total={stats['total']}"
          )
          if stats["no_tests"] > 0:
              print(
                  f"FAIL: {stats['no_tests']} mutantes sin tests asociados — "
                  "el subconjunto elegido en source_paths no esta cubierto por "
                  "pytest_add_cli_args_test_selection. Revisa mutation.yml."
              )
              sys.exit(1)
          if score < 0.70:
              print(f"FAIL: mutation score {score:.1%} < 70% (gate doctrina TST)")
              sys.exit(1)
          print(f"PASS: mutation score {score:.1%} >= 70%")
          PY

      - name: Upload mutation stats
        # Evidencia persistente para auditoria (SRE / doctrina BTR).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-cicd-stats
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: error

      - name: Cleanup setup.cfg temporal
        # Idempotencia: el archivo de config no queda en el workspace.
        if: always()
        run: |
          rm -f setup.cfg
          echo "setup.cfg temporal eliminado"