name: Auto-merge on green

# Activa auto-merge en PRs que no son drafts y cuyos checks requeridos
# (lint, test, security) ya estan pasando. Cuando todos los status checks
# requeridos lleguen a "success" GitHub fusiona el PR automaticamente:
# la accion enable-pull-request-automerge registra la intencion de merge y es
# el propio GitHub quien espera a los required checks (no hace falta un job
# extra que escuche check_run).
#
# Seguridad:
#   - Solo activa auto-merge en PRs desde la misma repo (no forks)
#   - Solo activa auto-merge si el autor no es dependabot (lo hace manual)
#   - El merge final sigue requiriendo las branch protections (CODEOWNERS,
#     approvals si estan configuradas, conversaciones resueltas).
#
# Historial (deuda corregida): el job `check-completion` usaba
# `peter-evans/find-pull-request-action@v2`, cuyo repositorio fue eliminado
# (404 "repository not found" en el run #36207651021). Se elimino el job
# redundante: el auto-merge nativo ya espera a los checks requeridos.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  # Necesario para llamar a la API de auto-merge
  pull-requests: write
  # enable-pull-request-automerge (v3) llama a la API de auto-merge y
  # requiere contents: write (con read: "Resource not accessible by integration")
  contents: write

jobs:
  auto-merge:
    # Solo PRs listos (no drafts), de la misma repo y no de dependabot.
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.event.repository.full_name &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          # Token del repo (no del PR) para llamar a la API
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pull request number del evento
          pull-request-number: ${{ github.event.pull_request.number }}
          # Estrategia de merge: squash (recomendado para linear history)
          merge-method: squash
