name: diag

on:
  push:
    branches: [diag-ollama-ci]

jobs:
  diag:
    name: diag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --group test
      - name: Run failing tests with traceback
        run: |
          uv run python -m pytest harness/tests/test_ollama_client.py harness/tests/test_run_commands.py -v --cov=harness --cov-report=term -x -p no:randomly 2>&1 || true
