name: Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scan:
    name: Security Audit
    runs-on: ubuntu-latest
    # nltk 3.10 (dep de safety v3 para typosquatting) bloquea imports de
    # 'regex' cuando el .venv esta dentro del CWD. Escape oficial:
    # NLTK_DISABLE_IMPORT_SECURITY=1 (ver nltk/inisec.py).
    env:
      NLTK_DISABLE_IMPORT_SECURITY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Install dependencies
        # regex es dependencia de safety (import directo); no viene del
        # dependency-group test -> sin el, safety falla en Python 3.12.
        run: |
          uv sync
          uv pip install 'safety>=3.0' bandit regex
      - name: Bandit
        # Mismo patron que el job Security de ci.yml (fix a032c36):
        # se audita el lockfile exportado, NO el Python del sistema
        # (pip-audit auditaba setuptools 79.0.1 del runner, CVE-2026-3447).
        run: uv run bandit -r harness/ -x harness/tests -ll -q
      - name: Security audit
        run: |
          uv export --format requirements-txt --no-hashes > /tmp/requirements.txt
          uv run safety check -r /tmp/requirements.txt --output text
