name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Install dependencies
        run: uv pip install ruff mypy
      - name: Ruff
        run: ruff check harness/
      - name: MyPy
        # TODO(ADR-0037): 92 errores de tipo en 32 archivos detectados 2026-07-31
        # (build-up desde 2026-05). mypy queda en warning hasta tipado progresivo.
        # Tracking: docs/src/es/roadmap/estado.md > Deuda tecnica.
        run: mypy harness/ --ignore-missing-imports || true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Install dependencies
        run: uv sync --group test
      - name: Run tests
        run: |
          uv run python -m pytest harness/tests/ -v --cov=harness --cov-report=term --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Install dependencies
        run: |
          uv sync
          # Bootstrap pip en el venv (uv no lo incluye por default).
          # `uv pip install pip` solo instala el wrapper, no el modulo.
          uv run python -m ensurepip --upgrade
          uv pip install bandit pip-audit
      - name: Bandit
        run: uv run bandit -r harness/ -x harness/tests -ll -q
      - name: Pip audit
        # Forzamos que pip-audit audite el venv (no el Python del sistema)
        # via PIPAPI_PYTHON_LOCATION. El venv tiene setuptools >= 83.0.0.
        run: uv run pip-audit
        env:
          PIPAPI_PYTHON_LOCATION: ${{ github.workspace }}/.venv/bin/python

  compile:
    name: Compile
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Install dependencies
        run: uv sync
      - name: Check compile
        run: |
          python -c "
          import py_compile, glob
          files = glob.glob('harness/**/*.py', recursive=True)
          errors = 0
          for f in files:
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError:
                  print(f'FAIL: {f}')
                  errors += 1
          if errors: exit(1)
          print(f'OK: {len(files)} files')
          "

  agents:
    name: Agents
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: Install dependencies
        run: uv sync
      - name: Verify agents
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from harness.orchestrator.agent_discovery import discover_agents_recursive
          agents = discover_agents_recursive()
          print(f'Found {len(agents)} agents')
          assert len(agents) >= 5
          assert 'coordinator' in agents
          assert 'builder' in agents
          "

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          chmod +x mdbook
          sudo mv mdbook /usr/local/bin/mdbook
      - name: Build mdbook
        run: mdbook build
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book
