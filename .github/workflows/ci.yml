name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
      - name: Ruff
        run: ruff check harness/ --line-length=100
      - name: MyPy
        run: mypy harness/ --ignore-missing-imports || true

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run tests
        run: |
          python -m pytest harness/tests/ -v --cov=harness --cov-report=term
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  security:
    name: Security
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit
          pip install -e "."
      - name: Bandit
        run: bandit -r harness/ -ll || true
      - name: Pip audit
        run: pip-audit || true

  compile:
    name: Compile
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "."
      - name: Check compile
        run: |
          python -c "
          import py_compile, glob
          files = glob.glob('harness/**/*.py', recursive=True)
          errors = 0
          for f in files:
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError:
                  print(f'FAIL: {f}')
                  errors += 1
          if errors: exit(1)
          print(f'OK: {len(files)} files')
          "

  agents:
    name: Agents
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "."
      - name: Verify agents
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from harness.orchestrator.agent_discovery import discover_agents_recursive
          agents = discover_agents_recursive()
          print(f'Found {len(agents)} agents')
          assert len(agents) >= 5
          assert 'coordinator' in agents
          assert 'builder' in agents
          "
