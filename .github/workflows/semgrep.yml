name: Semgrep
on:
  push:
    branches: [main, public]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"  # semanal (lunes)

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Semgrep (latest OSS)
        run: pipx install semgrep
      - name: Run Semgrep (p/default)
        run: semgrep scan --config p/default --sarif-output=semgrep.sarif --severity ERROR,WARNING .
        continue-on-error: true  # reporta hallazgos sin bloquear (severity alta)
      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
        if: always()
