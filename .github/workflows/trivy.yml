name: Trivy
on:
  push:
    branches: [main, public]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # diario

jobs:
  trivy:
    name: trivy
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy — filesystem scan (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy.sarif
          exit-code: "1"  # falla el CI si hay HIGH/CRITICAL
      - name: Trivy — Dockerfile scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
        continue-on-error: true  # no bloquea si no hay imagen construida
      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
        if: always()
