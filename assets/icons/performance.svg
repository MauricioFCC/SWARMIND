<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Performance icon">
  <title>Performance — lightning + speed</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg)"/>

  <g stroke="#06B6D4" stroke-opacity="0.25" stroke-width="1.5" fill="none">
    <line x1="20" y1="170" x2="180" y2="170"/>
    <line x1="30" y1="60"  x2="30"  y2="170"/>
    <line x1="30" y1="60"  x2="180" y2="60" stroke-opacity="0.15"/>
  </g>

  <g stroke="#06B6D4" stroke-width="2.5" fill="none" stroke-linecap="round">
    <polyline points="30,150 60,120 80,135 110,90 135,105 160,70 180,80"/>
  </g>
  <g fill="#06B6D4">
    <circle cx="30"  cy="150" r="3.5"/>
    <circle cx="60"  cy="120" r="3.5"/>
    <circle cx="80"  cy="135" r="3.5"/>
    <circle cx="110" cy="90"  r="3.5"/>
    <circle cx="135" cy="105" r="3.5"/>
    <circle cx="160" cy="70"  r="3.5"/>
    <circle cx="180" cy="80"  r="3.5"/>
  </g>

  <path d="M 118 18 L 70 110 L 100 110 L 82 182 L 138 84 L 108 84 Z"
        fill="url(#bolt)" stroke="#0F172A" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 118 18 L 70 110 L 100 110 L 82 182 L 138 84 L 108 84 Z"
        fill="none" stroke="#F1F5F9" stroke-width="1.5" stroke-opacity="0.5" stroke-linejoin="round"/>
</svg>
