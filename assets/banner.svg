<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Swarmind banner">
  <title>Swarmind — Evolutive Multi-Agent System</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#0E2233"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.18" cy="0.5" r="0.35">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#06B6D4" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#halo)"/>

  <g stroke="#06B6D4" stroke-opacity="0.25" fill="none" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
  </g>

  <g stroke="#06B6D4" stroke-opacity="0.55" fill="none" stroke-width="1.2">
    <line x1="900" y1="40"  x2="1080" y2="120"/>
    <line x1="900" y1="120" x2="1080" y2="40"/>
    <line x1="900" y1="200" x2="1080" y2="280"/>
    <line x1="900" y1="280" x2="1080" y2="200"/>
    <line x1="950" y1="60"  x2="1180" y2="160"/>
    <line x1="1180" y1="160" x2="950" y2="260"/>
    <line x1="1080" y1="40"  x2="1180" y2="160"/>
    <line x1="1080" y1="280" x2="1180" y2="160"/>
    <line x1="900" y1="120" x2="1180" y2="160"/>
    <line x1="1080" y1="40"  x2="950" y2="260"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="900"  cy="40"  r="4"/>
    <circle cx="1080" cy="40"  r="4"/>
    <circle cx="900"  cy="120" r="4"/>
    <circle cx="1080" cy="120" r="6" fill="#F59E0B"/>
    <circle cx="900"  cy="200" r="4"/>
    <circle cx="1080" cy="200" r="4"/>
    <circle cx="900"  cy="280" r="4"/>
    <circle cx="1080" cy="280" r="4"/>
    <circle cx="950"  cy="60"  r="3"/>
    <circle cx="1180" cy="160" r="6" fill="#F59E0B"/>
    <circle cx="950"  cy="260" r="3"/>
  </g>

  <g transform="translate(80,60)">
    <g fill="none" stroke="#06B6D4" stroke-width="3">
      <polygon points="100,5 195,55 195,155 100,205 5,155 5,55"/>
    </g>
    <g fill="#0F172A" stroke="#06B6D4" stroke-width="3">
      <polygon points="100,25 175,65 175,145 100,185 25,145 25,65"/>
    </g>
    <g fill="none" stroke="url(#cyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 145 70 C 145 50, 125 40, 100 50 C 70 60, 55 90, 70 110 C 80 125, 100 130, 110 140 C 125 155, 122 175, 100 182 C 78 190, 60 178, 60 160"/>
    </g>
    <g fill="#22D3EE">
      <circle cx="100" cy="50"  r="5"/>
      <circle cx="70"  cy="110" r="5"/>
      <circle cx="110" cy="140" r="5"/>
    </g>
    <g fill="#F59E0B">
      <circle cx="100" cy="182" r="5"/>
      <circle cx="60"  cy="160" r="4"/>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="320" y="150" font-size="92" font-weight="800" letter-spacing="4" fill="#F1F5F9">SWARMIND</text>
    <text x="324" y="190" font-size="22" font-weight="500" letter-spacing="6" fill="#22D3EE">EVOLUTIVE MULTI-AGENT SYSTEM</text>
    <g font-size="16" font-weight="500" letter-spacing="2" fill="#94A3B8">
      <text x="324" y="232">20 AGENTS  ·  31 SKILLS  ·  32 ADRs  ·  5 RUNTIMES</text>
    </g>
  </g>

  <g transform="translate(560,260)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#64748B">
    <rect x="0" y="-18" width="14" height="14" fill="#06B6D4" rx="2"/>
    <text x="22" y="-7">$ swarmind orchestrate --goal "build anything"</text>
  </g>
</svg>
