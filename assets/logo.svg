<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Swarmind logo">
  <title>Swarmind</title>
  <desc>Evolutive Multi-Agent System logo: stylized S formed by connected nodes inside a hexagonal Swiss-watch frame.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>

  <g stroke="#06B6D4" stroke-opacity="0.18" fill="none">
    <circle cx="256" cy="256" r="210"/>
    <circle cx="256" cy="256" r="180"/>
    <circle cx="256" cy="256" r="150"/>
  </g>

  <g fill="none" stroke="#06B6D4" stroke-opacity="0.35" stroke-width="1.5">
    <polygon points="256,40 440,140 440,372 256,472 72,372 72,140"/>
    <polygon points="256,80 400,160 400,352 256,432 112,352 112,160" stroke-opacity="0.2"/>
  </g>

  <g fill="#0F172A" stroke="#06B6D4" stroke-width="3">
    <polygon points="256,40 440,140 440,372 256,472 72,372 72,140"/>
  </g>
  <g fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round">
    <line x1="256" y1="40" x2="256" y2="56"/>
    <line x1="440" y1="140" x2="425" y2="149"/>
    <line x1="440" y1="372" x2="425" y2="363"/>
    <line x1="256" y1="472" x2="256" y2="456"/>
    <line x1="72" y1="372" x2="87" y2="363"/>
    <line x1="72" y1="140" x2="87" y2="149"/>
  </g>

  <g stroke="#06B6D4" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow)">
    <path d="M 340 160
             C 340 120, 300 100, 256 120
             C 200 145, 175 200, 200 240
             C 220 270, 260 280, 280 300
             C 305 325, 300 365, 256 380
             C 210 395, 175 370, 175 335"
          stroke="url(#sGrad)"/>
    <path d="M 175 335
             C 175 355, 185 370, 200 380"
          stroke="url(#sGrad)"/>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="256" cy="120" r="9" fill="#22D3EE" stroke="#0F172A" stroke-width="2"/>
    <circle cx="200" cy="240" r="9" fill="#22D3EE" stroke="#0F172A" stroke-width="2"/>
    <circle cx="280" cy="300" r="9" fill="#22D3EE" stroke="#0F172A" stroke-width="2"/>
    <circle cx="256" cy="380" r="9" fill="#F59E0B" stroke="#0F172A" stroke-width="2"/>
    <circle cx="175" cy="335" r="7" fill="#06B6D4" stroke="#0F172A" stroke-width="2"/>
    <circle cx="340" cy="160" r="7" fill="#F59E0B" stroke="#0F172A" stroke-width="2"/>
  </g>

  <g stroke="#06B6D4" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="3 3" fill="none">
    <line x1="256" y1="120" x2="200" y2="240"/>
    <line x1="200" y1="240" x2="280" y2="300"/>
    <line x1="280" y1="300" x2="256" y2="380"/>
    <line x1="256" y1="120" x2="340" y2="160"/>
    <line x1="340" y1="160" x2="280" y2="300"/>
  </g>

  <g fill="#F1F5F9" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">
    <text x="256" y="500" font-size="34" font-weight="700" letter-spacing="2">SWARMIND</text>
  </g>
</svg>
