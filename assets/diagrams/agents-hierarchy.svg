<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Swarmind agents hierarchy">
  <title>Swarmind — Agent Hierarchy</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="700" fill="url(#bg)"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#F1F5F9">
    <text x="40" y="50" font-size="26" font-weight="800">Agent Hierarchy</text>
    <text x="40" y="76" font-size="13" fill="#94A3B8" font-weight="500" letter-spacing="2">COORDINATOR → SPECIALISTS → SUB-AGENTS</text>
  </g>

  <g stroke="#22D3EE" stroke-width="2" fill="none" stroke-opacity="0.6">
    <line x1="500" y1="160" x2="200" y2="290"/>
    <line x1="500" y1="160" x2="380" y2="290"/>
    <line x1="500" y1="160" x2="560" y2="290"/>
    <line x1="500" y1="160" x2="740" y2="290"/>
    <line x1="500" y1="160" x2="880" y2="290"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(500,120)">
      <rect x="-110" y="-40" width="220" height="80" rx="14" fill="url(#cyan)" stroke="#0F172A" stroke-width="3"/>
      <text x="0" y="-6" text-anchor="middle" font-size="20" font-weight="800" fill="#0F172A">COORDINATOR</text>
      <text x="0" y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#0F172A" opacity="0.7">plan · dispatch · budget</text>
    </g>

    <g transform="translate(200,330)">
      <rect x="-80" y="-40" width="160" height="70" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" font-size="16" font-weight="700" fill="#F59E0B">Builder</text>
      <text x="0" y="10" text-anchor="middle" font-size="10" fill="#94A3B8">code · refactor · test</text>
    </g>
    <g transform="translate(380,330)">
      <rect x="-80" y="-40" width="160" height="70" rx="10" fill="#1E293B" stroke="#22D3EE" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" font-size="16" font-weight="700" fill="#22D3EE">Scientist</text>
      <text x="0" y="10" text-anchor="middle" font-size="10" fill="#94A3B8">research · analyze</text>
    </g>
    <g transform="translate(560,330)">
      <rect x="-80" y="-40" width="160" height="70" rx="10" fill="#1E293B" stroke="#22D3EE" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" font-size="16" font-weight="700" fill="#22D3EE">Guardian</text>
      <text x="0" y="10" text-anchor="middle" font-size="10" fill="#94A3B8">security · audit · SBOM</text>
    </g>
    <g transform="translate(740,330)">
      <rect x="-80" y="-40" width="160" height="70" rx="10" fill="#1E293B" stroke="#22D3EE" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" font-size="16" font-weight="700" fill="#22D3EE">Evolve</text>
      <text x="0" y="10" text-anchor="middle" font-size="10" fill="#94A3B8">meta-learning · FDE</text>
    </g>
    <g transform="translate(880,330)">
      <rect x="-60" y="-40" width="120" height="70" rx="10" fill="#1E293B" stroke="#22D3EE" stroke-width="2"/>
      <text x="0" y="-10" text-anchor="middle" font-size="16" font-weight="700" fill="#22D3EE">Oracle</text>
      <text x="0" y="10" text-anchor="middle" font-size="10" fill="#94A3B8">user-facing</text>
    </g>
  </g>

  <g stroke="#06B6D4" stroke-width="1.4" fill="none" stroke-opacity="0.5">
    <line x1="200" y1="370" x2="120" y2="490"/>
    <line x1="200" y1="370" x2="220" y2="490"/>
    <line x1="200" y1="370" x2="290" y2="490"/>
    <line x1="380" y1="370" x2="360" y2="490"/>
    <line x1="380" y1="370" x2="440" y2="490"/>
    <line x1="560" y1="370" x2="540" y2="490"/>
    <line x1="560" y1="370" x2="620" y2="490"/>
    <line x1="740" y1="370" x2="740" y2="490"/>
    <line x1="740" y1="370" x2="820" y2="490"/>
    <line x1="880" y1="370" x2="880" y2="490"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#F1F5F9">
    <g transform="translate(120,520)">
      <rect x="-50" y="-22" width="100" height="44" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="0" y="-2" text-anchor="middle">Coder</text>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#94A3B8">files · git</text>
    </g>
    <g transform="translate(220,520)">
      <rect x="-50" y="-22" width="100" height="44" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="0" y="-2" text-anchor="middle">Refactor</text>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#94A3B8">lint · types</text>
    </g>
    <g transform="translate(290,520)">
      <rect x="-40" y="-22" width="80" height="44" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="0" y="-2" text-anchor="middle">QA</text>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#94A3B8">tests</text>
    </g>
    <g transform="translate(360,520)">
      <rect x="-50" y="-22" width="100" height="44" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="0" y="-2" text-anchor="middle">Researcher</text>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#94A3B8">web · docs</text>
    </g>
    <g transform="translate(440,520)">
      <rect x="-50" y="-22" width="100" height="44" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="0" y="-2" text-anchor="middle">Quant</text>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#94A3B8">alpha · CQE</text>
    </g>
    <g transform="translate(540,520)">
      <rect x="-50" y="-22" width="100" height="44" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="0" y="-2" text-anchor="middle">Auditor</text>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#94A3B8">SAST · SBOM</text>
    </g>
    <g transform="translate(620,520)">
      <rect x="-50" y="-22" width="100" height="44" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="0" y="-2" text-anchor="middle">Reviewer</text>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#94A3B8">PR · diff</text>
    </g>
    <g transform="translate(740,520)">
      <rect x="-50" y="-22" width="100" height="44" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="0" y="-2" text-anchor="middle" fill="#F59E0B">Designer</text>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#94A3B8">prompts · A/B</text>
    </g>
    <g transform="translate(820,520)">
      <rect x="-40" y="-22" width="80" height="44" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="0" y="-2" text-anchor="middle">Skill</text>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#94A3B8">compose</text>
    </g>
    <g transform="translate(880,520)">
      <rect x="-40" y="-22" width="80" height="44" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
      <text x="0" y="-2" text-anchor="middle">Chat</text>
      <text x="0" y="12" text-anchor="middle" font-size="8" fill="#94A3B8">NL ↔</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B" letter-spacing="1.5">
    <text x="500" y="610" text-anchor="middle">+ 10 MORE SUB-AGENTS (DEPLOYED ON DEMAND)</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#22D3EE" font-weight="600" letter-spacing="1">
    <text x="500" y="660" text-anchor="middle">DYNAMIC SCALING · TOKEN BUDGETS · GPU ACCELERATION · HOOK-DRIVEN</text>
  </g>
</svg>
