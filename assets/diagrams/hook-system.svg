<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="Swarmind hook system">
  <title>Swarmind — Hook System</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1000" height="500" fill="url(#bg)"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#F1F5F9">
    <text x="40" y="50" font-size="24" font-weight="800">Hook System</text>
    <text x="40" y="72" font-size="12" fill="#94A3B8" font-weight="500" letter-spacing="2">PRE_TOOL → VALIDATION → TOOL → POST_TOOL → AUDIT</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(80,200)">
      <rect x="-60" y="-40" width="120" height="80" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" font-size="13" font-weight="800" fill="#22D3EE">CALLER</text>
      <text x="0" y="10" text-anchor="middle" font-size="9" fill="#94A3B8">agent · tool</text>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="#94A3B8">service</text>
    </g>

    <g transform="translate(260,120)">
      <rect x="-65" y="-36" width="130" height="72" rx="10" fill="#1E293B" stroke="#22D3EE" stroke-width="2.5"/>
      <text x="0" y="-8" text-anchor="middle" font-size="12" font-weight="800" fill="#22D3EE">PRE_TOOL</text>
      <text x="0" y="10" text-anchor="middle" font-size="9" fill="#94A3B8">policy · budget</text>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="#94A3B8">redact PII</text>
    </g>

    <g transform="translate(260,290)">
      <rect x="-65" y="-36" width="130" height="72" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="2.5"/>
      <text x="0" y="-8" text-anchor="middle" font-size="12" font-weight="800" fill="#F59E0B">POST_TOOL</text>
      <text x="0" y="10" text-anchor="middle" font-size="9" fill="#94A3B8">validate output</text>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="#94A3B8">trace · metrics</text>
    </g>

    <g transform="translate(480,200)">
      <rect x="-70" y="-50" width="140" height="100" rx="12" fill="url(#cyan)" stroke="#0F172A" stroke-width="2.5"/>
      <text x="0" y="-22" text-anchor="middle" font-size="14" font-weight="800" fill="#0F172A">TOOL EXEC</text>
      <g font-size="10" font-weight="600" fill="#0F172A">
        <text x="-55" y="0">▸ sandbox</text>
        <text x="20"  y="0">▸ timeout</text>
        <text x="-55" y="16">▸ retry</text>
        <text x="20"  y="16">▸ circuit-break</text>
        <text x="-55" y="32" opacity="0.75">▸ resource caps</text>
      </g>
    </g>

    <g transform="translate(700,120)">
      <rect x="-70" y="-40" width="140" height="80" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" font-size="13" font-weight="800" fill="#22D3EE">VALIDATION</text>
      <text x="0" y="10" text-anchor="middle" font-size="9" fill="#94A3B8">schema · types</text>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="#94A3B8">policy gate</text>
    </g>

    <g transform="translate(700,290)">
      <rect x="-70" y="-40" width="140" height="80" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" font-size="13" font-weight="800" fill="#22D3EE">TRANSFORM</text>
      <text x="0" y="10" text-anchor="middle" font-size="9" fill="#94A3B8">normalize · cache</text>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="#94A3B8">rehydrate</text>
    </g>

    <g transform="translate(900,200)">
      <rect x="-60" y="-40" width="120" height="80" rx="12" fill="url(#gold)" stroke="#0F172A" stroke-width="2.5"/>
      <text x="0" y="-8" text-anchor="middle" font-size="13" font-weight="800" fill="#0F172A">AUDIT LOG</text>
      <text x="0" y="10" text-anchor="middle" font-size="9" fill="#0F172A" opacity="0.75">immutable</text>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="#0F172A" opacity="0.75">SIEM-ready</text>
    </g>
  </g>

  <g stroke="#22D3EE" stroke-width="2" fill="none" marker-end="url(#arr)" stroke-opacity="0.9">
    <line x1="142" y1="180" x2="195" y2="130"/>
    <line x1="325" y1="120" x2="408" y2="170"/>
    <line x1="552" y1="200" x2="628" y2="130"/>
    <line x1="772" y1="120" x2="838" y2="180"/>
    <line x1="840" y1="200" x2="772" y2="278"/>
  </g>
  <g stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#arrG)" stroke-opacity="0.9" stroke-dasharray="5 4">
    <line x1="552" y1="230" x2="328" y2="280"/>
    <line x1="260" y1="328" x2="195" y2="240"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#22D3EE" font-weight="700" letter-spacing="1.5">
    <text x="170" y="155">hook</text>
    <text x="365" y="145">invoke</text>
    <text x="590" y="155">call</text>
    <text x="800" y="155">verify</text>
    <text x="800" y="255">return</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#F59E0B" font-weight="700" letter-spacing="1.5">
    <text x="445" y="260" text-anchor="middle">on error</text>
    <text x="170" y="270" text-anchor="middle">on deny</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B" letter-spacing="1.5">
    <text x="500" y="440" text-anchor="middle">EVERY TOOL CALL · EVERY BOUNDARY · ZERO TRUST BY DEFAULT</text>
  </g>
</svg>
