<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Swarmind data flow">
  <title>Swarmind — Data Flow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#F1F5F9">
    <text x="40" y="50" font-size="24" font-weight="800">Data Flow</text>
    <text x="40" y="72" font-size="12" fill="#94A3B8" font-weight="500" letter-spacing="2">REQUEST → PLAN → AGENTS → MEMORY → RESPONSE</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(80,200)">
      <rect x="-65" y="-40" width="130" height="80" rx="12" fill="url(#cyan)" stroke="#0F172A" stroke-width="2.5"/>
      <text x="0" y="-8" text-anchor="middle" font-size="14" font-weight="800" fill="#0F172A">REQUEST</text>
      <text x="0" y="10" text-anchor="middle" font-size="9" fill="#0F172A" opacity="0.7">goal · context</text>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="#0F172A" opacity="0.7">constraints</text>
    </g>

    <g transform="translate(280,200)">
      <rect x="-70" y="-40" width="140" height="80" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" font-size="14" font-weight="800" fill="#22D3EE">ORCHESTRATOR</text>
      <text x="0" y="10" text-anchor="middle" font-size="9" fill="#94A3B8">decompose · route</text>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="#94A3B8">token budgets</text>
    </g>

    <g transform="translate(490,200)">
      <rect x="-70" y="-40" width="140" height="80" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" font-size="14" font-weight="800" fill="#F59E0B">PLAN</text>
      <text x="0" y="10" text-anchor="middle" font-size="9" fill="#94A3B8">DAG · priorities</text>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="#94A3B8">sub-tasks</text>
    </g>

    <g transform="translate(720,200)">
      <rect x="-90" y="-50" width="180" height="100" rx="12" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <text x="0" y="-22" text-anchor="middle" font-size="14" font-weight="800" fill="#22D3EE">AGENTS</text>
      <g font-size="10" font-weight="600" fill="#F1F5F9">
        <text x="-70" y="0" fill="#22D3EE">▸ Builder</text>
        <text x="20"  y="0" fill="#22D3EE">▸ Scientist</text>
        <text x="-70" y="16" fill="#22D3EE">▸ Guardian</text>
        <text x="20"  y="16" fill="#22D3EE">▸ Evolve</text>
        <text x="-70" y="32" fill="#F59E0B">▸ Oracle</text>
        <text x="20"  y="32" fill="#94A3B8">▸ +15 more</text>
      </g>
    </g>

    <g transform="translate(970,130)">
      <rect x="-75" y="-32" width="150" height="64" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" font-size="13" font-weight="800" fill="#22D3EE">MEMORY</text>
      <text x="0" y="10" text-anchor="middle" font-size="9" fill="#94A3B8">Lance · Chroma</text>
      <text x="0" y="22" text-anchor="middle" font-size="9" fill="#94A3B8">Qdrant · SQLite-vec</text>
    </g>

    <g transform="translate(970,290)">
      <rect x="-75" y="-32" width="150" height="64" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" font-size="13" font-weight="800" fill="#F59E0B">TOOLS</text>
      <text x="0" y="10" text-anchor="middle" font-size="9" fill="#94A3B8">MCP · Hooks</text>
      <text x="0" y="22" text-anchor="middle" font-size="9" fill="#94A3B8">Vault · Audit</text>
    </g>

    <g transform="translate(1130,200)">
      <rect x="-50" y="-40" width="100" height="80" rx="12" fill="url(#cyan)" stroke="#0F172A" stroke-width="2.5"/>
      <text x="0" y="-8" text-anchor="middle" font-size="14" font-weight="800" fill="#0F172A">RESPONSE</text>
      <text x="0" y="10" text-anchor="middle" font-size="9" fill="#0F172A" opacity="0.7">artifact</text>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="#0F172A" opacity="0.7">+ trace</text>
    </g>
  </g>

  <g stroke="#22D3EE" stroke-width="2.5" fill="none" marker-end="url(#arr)" stroke-opacity="0.85">
    <line x1="148" y1="200" x2="208" y2="200"/>
    <line x1="352" y1="200" x2="418" y2="200"/>
    <line x1="562" y1="200" x2="628" y2="200"/>
    <line x1="812" y1="180" x2="893" y2="142"/>
    <line x1="812" y1="220" x2="893" y2="278"/>
    <line x1="1047" y1="130" x2="1078" y2="180" stroke-dasharray="4 4" stroke-opacity="0.6"/>
    <line x1="1047" y1="290" x2="1078" y2="240" stroke-dasharray="4 4" stroke-opacity="0.6"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#22D3EE" font-weight="600" letter-spacing="1.5">
    <text x="180" y="190" text-anchor="middle">POST</text>
    <text x="385" y="190" text-anchor="middle">DECOMPOSE</text>
    <text x="595" y="190" text-anchor="middle">DISPATCH</text>
    <text x="855" y="120" text-anchor="middle" fill="#F59E0B">RECALL</text>
    <text x="855" y="290" text-anchor="middle" fill="#F59E0B">EXECUTE</text>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B">
    <text x="40" y="370">pre-hook → post-hook · OpenTelemetry spans · zero-trust policy enforcement at every boundary</text>
  </g>
</svg>
