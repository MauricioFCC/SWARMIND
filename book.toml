[book]
title = "AGENTIC Harness Manual"
authors = ["AGENTIC Team"]
description = "Documentacion completa del sistema multi-agente AGENTIC Swiss Watch"
language = "es"
multilingual = false

[output.html]
theme = "docs/theme"
default-theme = "ayu"
preferred-dark-theme = "ayu"
mathjax-support = false
copy-fonts = true
additional-css = ["docs/theme/custom.css"]

[output.html.search]
limit-results = 30
teaser-word-count = 10

[build]
build-dir = "docs/book"
create-missing = false
