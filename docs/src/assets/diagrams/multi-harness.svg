<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-label="Swarmind multi-harness">
  <title>Swarmind — Multi-Harness Adapter Layer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#bg)"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" fill="#F1F5F9">
    <text x="40" y="50" font-size="26" font-weight="800">Multi-Harness Adapter Layer</text>
    <text x="40" y="76" font-size="13" fill="#94A3B8" font-weight="500" letter-spacing="2">ONE SWARMIND · FIVE RUNTIMES</text>
  </g>

  <g stroke="#22D3EE" stroke-width="2" fill="none" stroke-opacity="0.55">
    <line x1="500" y1="250" x2="140" y2="450"/>
    <line x1="500" y1="250" x2="320" y2="450"/>
    <line x1="500" y1="250" x2="500" y2="450"/>
    <line x1="500" y1="250" x2="680" y2="450"/>
    <line x1="500" y1="250" x2="860" y2="450"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <g transform="translate(500,200)">
      <rect x="-220" y="-60" width="440" height="120" rx="16" fill="url(#cyan)" stroke="#0F172A" stroke-width="3"/>
      <text x="0" y="-22" text-anchor="middle" font-size="22" font-weight="800" fill="#0F172A">SWARMIND CORE</text>
      <text x="0" y="2" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A" letter-spacing="2">A2A PROTOCOL · HOOKS · TOKEN BUDGETS</text>
      <text x="0" y="22" text-anchor="middle" font-size="10" fill="#0F172A" opacity="0.75">20 agents · 31 skills · 32 ADRs</text>
      <text x="0" y="40" text-anchor="middle" font-size="10" fill="#0F172A" opacity="0.75">OpenTelemetry · MCP · Hooks</text>
    </g>

    <g transform="translate(140,450)">
      <rect x="-65" y="-35" width="130" height="70" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#22D3EE">OpenCode</text>
      <text x="0" y="10" text-anchor="middle" font-size="10" fill="#94A3B8">native harness</text>
      <text x="0" y="24" text-anchor="middle" font-size="9" fill="#F59E0B">★ first-class</text>
    </g>
    <g transform="translate(320,450)">
      <rect x="-65" y="-35" width="130" height="70" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#22D3EE">Claude Code</text>
      <text x="0" y="10" text-anchor="middle" font-size="10" fill="#94A3B8">Anthropic SDK</text>
    </g>
    <g transform="translate(500,450)">
      <rect x="-65" y="-35" width="130" height="70" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#22D3EE">Codex CLI</text>
      <text x="0" y="10" text-anchor="middle" font-size="10" fill="#94A3B8">OpenAI shell</text>
    </g>
    <g transform="translate(680,450)">
      <rect x="-65" y="-35" width="130" height="70" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#22D3EE">Cursor</text>
      <text x="0" y="10" text-anchor="middle" font-size="10" fill="#94A3B8">IDE agent</text>
    </g>
    <g transform="translate(860,450)">
      <rect x="-65" y="-35" width="130" height="70" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" font-size="15" font-weight="800" fill="#22D3EE">Gemini CLI</text>
      <text x="0" y="10" text-anchor="middle" font-size="10" fill="#94A3B8">Google SDK</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#64748B" font-weight="600" letter-spacing="2">
    <text x="500" y="540" text-anchor="middle">ADAPTER PROTOCOL · STREAMING · TOKEN ACCOUNTING · OBSERVABILITY</text>
  </g>

  <g transform="translate(40,140)">
    <rect width="200" height="44" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#F59E0B" letter-spacing="2">PLUGGABLE</text>
    <text x="100" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#94A3B8">add your runtime in &lt;200 LOC</text>
  </g>
  <g transform="translate(760,140)">
    <rect width="200" height="44" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
    <text x="100" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#22D3EE" letter-spacing="2">PROTOCOL-AGNOSTIC</text>
    <text x="100" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#94A3B8">MCP · JSON-RPC · stdio</text>
  </g>
</svg>
