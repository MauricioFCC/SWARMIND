<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Swarmind social preview">
  <title>Swarmind — Evolutive Multi-Agent System</title>
  <desc>GitHub social preview: dark navy canvas with cyan network, hex emblem, name, tagline, and key metrics.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="haloL" cx="0.15" cy="0.4" r="0.45">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloR" cx="0.85" cy="0.6" r="0.45">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#06B6D4" fill-opacity="0.12"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#haloL)"/>
  <rect width="1280" height="640" fill="url(#haloR)"/>

  <g stroke="#06B6D4" stroke-opacity="0.08" fill="none" stroke-width="1">
    <line x1="0" y1="120" x2="1280" y2="120"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="520" x2="1280" y2="520"/>
  </g>

  <g transform="translate(140,150)" stroke="#06B6D4" fill="none" stroke-width="3">
    <polygon points="170,10 330,90 330,250 170,330 10,250 10,90" stroke-opacity="0.5"/>
    <polygon points="170,40 300,105 300,235 170,300 40,235 40,105"/>
    <g stroke="url(#cyan)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 245 120 C 245 90, 215 75, 170 90 C 120 110, 100 150, 120 180 C 135 200, 165 205, 180 220 C 200 240, 195 270, 170 280 C 140 290, 110 275, 110 250"/>
    </g>
  </g>
  <g transform="translate(140,150)" filter="url(#soft)">
    <g fill="#22D3EE" stroke="#0F172A" stroke-width="2">
      <circle cx="170" cy="90"  r="9"/>
      <circle cx="120" cy="180" r="9"/>
      <circle cx="180" cy="220" r="9"/>
    </g>
    <g fill="#F59E0B" stroke="#0F172A" stroke-width="2">
      <circle cx="170" cy="280" r="9"/>
      <circle cx="110" cy="250" r="7"/>
      <circle cx="245" cy="120" r="7"/>
    </g>
  </g>
  <g stroke="#06B6D4" stroke-opacity="0.5" stroke-dasharray="3 4" fill="none">
    <line x1="310" y1="240" x2="360" y2="200"/>
    <line x1="360" y1="200" x2="420" y2="260"/>
    <line x1="360" y1="200" x2="420" y2="160"/>
    <line x1="420" y1="160" x2="500" y2="220"/>
    <line x1="420" y1="260" x2="500" y2="220"/>
    <line x1="500" y1="220" x2="560" y2="160"/>
    <line x1="500" y1="220" x2="560" y2="280"/>
  </g>
  <g fill="#22D3EE">
    <circle cx="360" cy="200" r="5"/>
    <circle cx="420" cy="160" r="5"/>
    <circle cx="420" cy="260" r="5"/>
    <circle cx="500" cy="220" r="6" fill="#F59E0B"/>
    <circle cx="560" cy="160" r="5"/>
    <circle cx="560" cy="280" r="5"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="640" y="180" font-size="28" font-weight="600" letter-spacing="8" fill="#22D3EE">EVOLUTIVE MULTI-AGENT SYSTEM</text>
    <text x="640" y="290" font-size="140" font-weight="800" letter-spacing="6" fill="#F1F5F9">Swarmind</text>
    <text x="640" y="345" font-size="26" font-weight="500" letter-spacing="3" fill="#94A3B8">Swiss-Watch precision · Dynamic scaling · Zero trust</text>

    <g transform="translate(640,420)" font-size="22" font-weight="700" letter-spacing="2" fill="#0F172A">
      <g transform="translate(0,0)">
        <rect width="130" height="56" rx="10" fill="#22D3EE"/>
        <text x="65" y="36" text-anchor="middle">20 Agents</text>
      </g>
      <g transform="translate(150,0)">
        <rect width="130" height="56" rx="10" fill="#06B6D4"/>
        <text x="65" y="36" text-anchor="middle">31 Skills</text>
      </g>
      <g transform="translate(300,0)">
        <rect width="130" height="56" rx="10" fill="#F59E0B"/>
        <text x="65" y="36" text-anchor="middle">32 ADRs</text>
      </g>
      <g transform="translate(450,0)">
        <rect width="160" height="56" rx="10" fill="#0F172A" stroke="#06B6D4" stroke-width="2"/>
        <text x="80" y="36" text-anchor="middle" fill="#22D3EE">5 Runtimes</text>
      </g>
    </g>

    <g transform="translate(640,530)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#64748B">
      <text>pip install swarmind-harness   ·   github.com/MauricioFCC/SWARMIND   ·   MIT</text>
    </g>
  </g>
</svg>
