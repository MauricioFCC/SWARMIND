<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Tokens icon">
  <title>Tokens — token economy</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="token" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="token2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg)"/>

  <g transform="translate(60,60)">
    <circle r="50" fill="url(#token2)" stroke="#0F172A" stroke-width="3"/>
    <circle r="40" fill="none" stroke="#F1F5F9" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="3 3"/>
    <text x="0" y="11" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="800" fill="#0F172A">$</text>
  </g>

  <g transform="translate(140,140)">
    <circle r="40" fill="url(#token)" stroke="#0F172A" stroke-width="3"/>
    <circle r="32" fill="none" stroke="#0F172A" stroke-width="1.5" stroke-opacity="0.5"/>
    <g fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round">
      <path d="M -12 0 L -2 10 L 14 -10"/>
    </g>
  </g>

  <g stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3" fill="none" stroke-opacity="0.7">
    <path d="M 105 80 Q 130 90 125 115"/>
  </g>
  <g fill="#F59E0B">
    <polygon points="125,115 119,108 121,120"/>
  </g>
</svg>
