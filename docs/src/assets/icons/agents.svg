<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Agents icon">
  <title>Agents — network of nodes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="90" fill="url(#halo)"/>

  <g stroke="#06B6D4" stroke-width="1.4" fill="none" stroke-opacity="0.55">
    <line x1="100" y1="100" x2="40"  y2="50"/>
    <line x1="100" y1="100" x2="160" y2="50"/>
    <line x1="100" y1="100" x2="40"  y2="150"/>
    <line x1="100" y1="100" x2="160" y2="150"/>
    <line x1="100" y1="100" x2="100" y2="30"/>
    <line x1="100" y1="100" x2="100" y2="170"/>
    <line x1="40"  y1="50"  x2="100" y2="30"/>
    <line x1="100" y1="30"  x2="160" y2="50"/>
    <line x1="40"  y1="150" x2="100" y2="170"/>
    <line x1="100" y1="170" x2="160" y2="150"/>
    <line x1="40"  y1="50"  x2="40"  y2="150"/>
    <line x1="160" y1="50"  x2="160" y2="150"/>
  </g>

  <g>
    <circle cx="100" cy="100" r="16" fill="#F59E0B" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="100" cy="100" r="6"  fill="#0F172A"/>
  </g>
  <g fill="#22D3EE" stroke="#0F172A" stroke-width="2">
    <circle cx="40"  cy="50"  r="9"/>
    <circle cx="160" cy="50"  r="9"/>
    <circle cx="40"  cy="150" r="9"/>
    <circle cx="160" cy="150" r="9"/>
  </g>
  <g fill="#06B6D4" stroke="#0F172A" stroke-width="2">
    <circle cx="100" cy="30"  r="7"/>
    <circle cx="100" cy="170" r="7"/>
  </g>
  <g fill="#94A3B8">
    <circle cx="70"  cy="65"  r="2.5"/>
    <circle cx="130" cy="65"  r="2.5"/>
    <circle cx="70"  cy="135" r="2.5"/>
    <circle cx="130" cy="135" r="2.5"/>
  </g>
</svg>
