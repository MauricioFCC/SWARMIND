<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Skills icon">
  <title>Skills — modular grid</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="28" fill="url(#bg)"/>

  <g>
    <rect x="30"  y="30"  width="40" height="40" rx="8" fill="url(#cell)" opacity="0.95"/>
    <rect x="80"  y="30"  width="40" height="40" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
    <rect x="130" y="30"  width="40" height="40" rx="8" fill="url(#cell)" opacity="0.95"/>

    <rect x="30"  y="80"  width="40" height="40" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
    <rect x="80"  y="80"  width="40" height="40" rx="8" fill="#F59E0B"/>
    <rect x="130" y="80"  width="40" height="40" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>

    <rect x="30"  y="130" width="40" height="40" rx="8" fill="url(#cell)" opacity="0.95"/>
    <rect x="80"  y="130" width="40" height="40" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2"/>
    <rect x="130" y="130" width="40" height="40" rx="8" fill="url(#cell)" opacity="0.95"/>
  </g>

  <g fill="#0F172A" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">
    <text x="50"  y="58">&lt;/&gt;</text>
    <text x="100" y="108">★</text>
    <text x="150" y="58">⚙</text>
    <text x="50"  y="158">Σ</text>
    <text x="150" y="158">λ</text>
  </g>
  <g fill="#22D3EE" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="800" text-anchor="middle">
    <text x="100" y="58">{}</text>
    <text x="50"  y="108" fill="#94A3B8">⬡</text>
    <text x="150" y="108" fill="#94A3B8">⬢</text>
    <text x="100" y="158">∞</text>
  </g>
</svg>
